<text x="24.0" y="206.0" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">Comparison</text>
<text x="24.0" y="222.0" font-size="11" font-weight="400" text-anchor="start" fill="#52514e">&gt;= becomes &gt;</text>
