<text x="24.0" y="30.0" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">25 mutants, split by operator: 13 for feedback, 12 held out for scoring</text>
<text x="24.0" y="50.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">A test set is never scored on the mutants it was shown as feedback</text>
