name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: Pipeline smoke run on the simulator
        run: |
          python -m tcgen.experiment --client simulated --reps 3 --db reports/smoke.db
          python -m tcgen.report --db reports/smoke.db --out reports/smoke.md
      - name: Publish smoke report
        if: always()
        run: cat reports/smoke.md >> "$GITHUB_STEP_SUMMARY"
