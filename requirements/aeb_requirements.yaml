system: AEB-lite
inputs:
  speed_kph:     {min: 0.0, max: 250.0, step: 0.1}
  obstacle_m:    {min: 0.0, step: 0.1, nullable: true}
  sensor_age_ms: {min: 0, step: 1}
outputs: [BRAKE, NO_ACTION, FAULT]
requirements:
  - id: REQ-01
    text: Brake when speed is at least 30 km/h, an obstacle is within 20 m, and sensor data is valid.
    expected: BRAKE
    boundaries:
      - {input: speed_kph, value: 30.0}
      - {input: obstacle_m, value: 20.0}
  - id: REQ-02
    text: Take no action when speed is below 30 km/h.
    expected: NO_ACTION
    boundaries:
      - {input: speed_kph, value: 30.0}
  - id: REQ-03
    text: Report a fault when sensor data is 200 ms old or older.
    expected: FAULT
    boundaries:
      - {input: sensor_age_ms, value: 200}
  - id: REQ-04
    text: In the fault state, return to normal after the sensor has been healthy for 1 s.
    expected: NORMAL
    boundaries:
      - {input: healthy_duration_ms, value: 1000}
  - id: REQ-05
    text: Report a fault when speed is outside 0 to 250 km/h.
    expected: FAULT
    boundaries:
      - {input: speed_kph, value: 0.0}
      - {input: speed_kph, value: 250.0}
