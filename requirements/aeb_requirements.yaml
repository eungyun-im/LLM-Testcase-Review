system: AEB-lite
description: >
  Decision function of a simplified automatic emergency braking feature.
  It takes one sample of three inputs and returns one action.

inputs:
  speed_kph:     {type: float, unit: km/h, resolution: 0.1}
  obstacle_m:    {type: float, unit: m, resolution: 0.1, nullable: true}
  sensor_age_ms: {type: int, unit: ms, resolution: 1}

outputs: [BRAKE, NO_ACTION, FAULT]

# Stage 1 covers the stateless requirements. REQ-04 (fault latch and recovery)
# needs timed sequences and belongs to stage 2.
requirements:
  - id: REQ-01
    text: When speed is at least 30 km/h, an obstacle is detected within 20 m, and sensor data is valid, the output is BRAKE.
  - id: REQ-02
    text: When speed is below 30 km/h and the inputs are valid, the output is NO_ACTION, with or without an obstacle.
  - id: REQ-03
    text: When sensor data is 200 ms old or older, the output is FAULT.
  - id: REQ-05
    text: When speed is below 0 km/h or above 250 km/h, the output is FAULT.

notes:
  - obstacle_m is empty when no obstacle is detected. No obstacle never produces BRAKE.
  - An invalid speed (REQ-05) is checked before sensor age (REQ-03), and both before the brake condition.

# Each boundary yields three points: value - resolution, value, value + resolution.
# strict_when lists what the other inputs must satisfy for the point to actually
# expose the boundary (used by the strict recall criterion).
boundaries:
  - id: B-BRAKE-SPEED
    input: speed_kph
    value: 30.0
    strict_when:
      obstacle_m: {max: 20.0, not_null: true}
      sensor_age_ms: {max: 199}
  - id: B-DETECT-RANGE
    input: obstacle_m
    value: 20.0
    strict_when:
      speed_kph: {min: 30.0, max: 250.0}
      sensor_age_ms: {max: 199}
  - id: B-SENSOR-TIMEOUT
    input: sensor_age_ms
    value: 200
    strict_when:
      speed_kph: {min: 0.0, max: 250.0}
  - id: B-SPEED-MIN
    input: speed_kph
    value: 0.0
    strict_when:
      sensor_age_ms: {max: 199}
  - id: B-SPEED-MAX
    input: speed_kph
    value: 250.0
    strict_when:
      sensor_age_ms: {max: 199}

# The atomic conditions the requirements are built from. A program can decide
# each of them for the inputs of a test. They are used for the input class
# check and to ground the cross-check. None of them says what the output is.
conditions:
  - {id: C-SPEED-LOW,   text: speed is below 0 km/h,              input: speed_kph,     op: "<",  value: 0.0}
  - {id: C-SPEED-HIGH,  text: speed is above 250 km/h,            input: speed_kph,     op: ">",  value: 250.0}
  - {id: C-SENSOR-OLD,  text: sensor data is 200 ms old or older, input: sensor_age_ms, op: ">=", value: 200}
  - {id: C-SPEED-BRAKE, text: speed is at least 30 km/h,          input: speed_kph,     op: ">=", value: 30.0}
  - {id: C-OBSTACLE,    text: an obstacle is detected,            input: obstacle_m,    op: present}
  - {id: C-IN-RANGE,    text: the obstacle is within 20 m,        input: obstacle_m,    op: "<=", value: 20.0}

# Input classes (equivalence partitions): combinations of conditions that the
# requirements treat differently. Every input belongs to exactly one class.
# Outputs are deliberately not listed.
partitions:
  - id: P-SPEED-LOW
    text: speed below the valid range
    when: {C-SPEED-LOW: true}
  - id: P-SPEED-HIGH
    text: speed above the valid range
    when: {C-SPEED-HIGH: true}
  - id: P-SENSOR-OLD
    text: valid speed, sensor data 200 ms old or older
    when: {C-SPEED-LOW: false, C-SPEED-HIGH: false, C-SENSOR-OLD: true}
  - id: P-SLOW
    text: valid speed below 30 km/h, fresh sensor data
    when: {C-SPEED-LOW: false, C-SENSOR-OLD: false, C-SPEED-BRAKE: false}
  - id: P-NO-OBSTACLE
    text: valid speed of at least 30 km/h, fresh sensor data, no obstacle detected
    when: {C-SPEED-HIGH: false, C-SENSOR-OLD: false, C-SPEED-BRAKE: true, C-OBSTACLE: false}
  - id: P-FAR
    text: valid speed of at least 30 km/h, fresh sensor data, obstacle farther than 20 m
    when: {C-SPEED-HIGH: false, C-SENSOR-OLD: false, C-SPEED-BRAKE: true, C-OBSTACLE: true, C-IN-RANGE: false}
  - id: P-NEAR
    text: valid speed of at least 30 km/h, fresh sensor data, obstacle within 20 m
    when: {C-SPEED-HIGH: false, C-SENSOR-OLD: false, C-SPEED-BRAKE: true, C-OBSTACLE: true, C-IN-RANGE: true}
